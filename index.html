<!DOCTYPE html>
<html>
<head>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
}

/* background */
#background {
    position: fixed;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    top: 0;
    left: 0;
}

/* Verana base */
#veranablink, #verana {
    position: absolute;
    left: 50px;
    bottom: 0;
    width: 300px;
}

/* normal state */
#verana {
    opacity: 1;
}

/* blink image hidden normally */
#veranablink {
    opacity: 1;
}

#verana {
    position: absolute;
    left: 50px;
    bottom: 0;
    width: 300px;
    animation: blink 4s infinite;
}

@keyframes blink {
    0%, 92%, 100% {
        opacity: 0; /* eyes open */
    }
    94% {
        opacity: 1; /* eyes closed */
    }
    96% {
        opacity: 0; /* open again */
    }
}
</style>

</head>

<body>

<img src="allback.png" id="background">

<img src="verana.png" id="verana">
<img src="veranablink.png" id="veranablink">

</body>
</html>
