<!DOCTYPE html>
<html>
<head>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
}

/* background */
#background {
    position: fixed;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    top: 0;
    left: 0;
}

/* Verana base */
#veranablink, #verana {
    position: absolute;
    left: 50px;
    bottom: 0;
    width: 300px;
}

/* normal state */
#veranablink {
    opacity: 1;
}

/* blink image hidden normally */
#verana {
    opacity: 0;
}

/* animation controls BOTH */
@keyframes blinkSwap {
    100%, 0%, 100% {
        opacity: 0; /* verana visible */
    }
    91% {
        opacity: 1;
    }
}

/* apply swap */
#veranablink {
    animation: blinkSwap 4s infinite;
}

#verana {
    animation: blinkSwap 4s infinite reverse;
}
</style>

</head>

<body>

<img src="allback.png" id="background">

<img src="verana.png" id="verana">
<img src="veranablink.png" id="veranablink">

</body>
</html>
